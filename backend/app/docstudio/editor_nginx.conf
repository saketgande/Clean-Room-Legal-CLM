# Served to the editor as one of its own nginx rules (mounted in
# docker-compose.override.yml as ds-aegis-plugin.conf, which the editor includes
# by wildcard and which sorts before its own ds-docservice.conf, so this rule
# is matched first).
#
# The editor serves every plugin file with "Cache-Control: immutable,
# max-age=31536000". That is right for its own plugins, which change when the
# editor is upgraded — and wrong for ours, which is edited while this tool is
# being built: a browser that has loaded it once will not ask again for a year,
# and the plugin running in the editor is then not the plugin on disk.
location ~ ^(/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?/(sdkjs-plugins)/(\{6F2A1C54-6E8B-4A1F-9D2C-3B7E5A904F11\})(/.*)$ {
  add_header Cache-Control "no-cache" always;
  alias /var/www/onlyoffice/documentserver/$2/$3$4;
}

# Development overrides — auto-merged by `docker compose up`.
#
# Turns the stack into a hot-reload dev environment AND makes it runnable over
# plain http://localhost. App config (API keys, secrets, model, integration
# mocks) comes from backend/.env; the settings below only force the
# runtime/web values that production mode would otherwise reject locally.
#
#   docker compose up -d                        -> DEVELOPMENT (this file is merged in)
#   docker compose -f docker-compose.yml up -d  -> PRODUCTION (this file is ignored)
#
# FORCE_POLLING / USEPOLLING are set because file-change events from the macOS
# host don't reliably reach the Linux containers; polling makes reload work.

# Local-safe runtime/web settings layered on top of backend/.env. ENVIRONMENT
# is forced to "development" so validate_runtime_settings() doesn't demand the
# full production hardening (HTTPS URLs, secure cookies, non-wildcard hosts…)
# that can't be satisfied on localhost. Integration mocks are NOT set here, so
# they follow backend/.env (real keys → real Claude/Reducto/Resend).
x-dev-app-env: &dev_app_env
  ENVIRONMENT: development
  DEBUG: "true"
  # Host port 3000 is already taken by another local process, so this stack's
  # frontend is remapped to 3001 (container-internal port is still 3000).
  APP_BASE_URL: http://localhost:3001
  CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
  ALLOWED_HOSTS: "*"
  FORCE_HTTPS: "false"
  REFRESH_COOKIE_SECURE: "false"
  EXPOSE_REFRESH_TOKEN_IN_BODY: "true"
  # Every permission check passes, so local dev can walk every screen without
  # seeding roles. Dev-only: validate_runtime_settings() refuses to boot
  # staging/production with this set, so it cannot ride along to a real deploy.
  DISABLE_RBAC: "true"
  # Demo agents default off (production posture); dev wants them visible.
  INTAKE_DEMO_AGENTS: "true"
  # The Word editor in the contract page (the onlyoffice service below).
  ONLYOFFICE_URL: http://localhost:8082
  ONLYOFFICE_JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-aegis-dev-onlyoffice-secret-local-only}"

services:
  # Exposed to the host so a local client (pgAdmin, psql) can connect for
  # manual inspection. Internal container traffic still uses postgres:5432
  # over the compose network; 5434 avoids clashing with a local Postgres.
  postgres:
    ports:
      - "5434:5432"

  # Run migrations from the live source too (so edited migrations apply).
  migrate:
    environment:
      <<: *dev_app_env
    volumes:
      - ./backend:/app

  backend:
    # The dev stage adds pytest/ruff, so the documented test commands run
    # against the container instead of needing a hand-installed toolchain.
    build:
      context: ./backend
      target: dev
    image: aegis/backend:dev
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--reload", "--reload-dir", "/app/app"]
    environment:
      <<: *dev_app_env
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app

  worker:
    # watchfiles restarts the Celery worker whenever app/ changes.
    command:
      ["watchfiles",
       "celery -A app.jobs.celery_app.celery_app worker --loglevel=info --concurrency=4",
       "/app/app"]
    environment:
      <<: *dev_app_env
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app

  beat:
    command:
      ["watchfiles",
       "celery -A app.jobs.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule",
       "/app/app"]
    environment:
      <<: *dev_app_env
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: dev
    image: aegis/frontend:dev
    command: ["npm", "run", "dev"]
    # Compose merges list-typed keys (like `ports`) by concatenation across
    # files, not replacement — `!override` is required here so this fully
    # replaces docker-compose.yml's "3000:3000" instead of adding to it.
    ports: !override
      - "3001:3000"
    environment:
      NODE_ENV: development
      # Reliable HMR/file-watching for Next.js inside Docker on macOS.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      # Anonymous volumes keep the image's node_modules + build cache, so the
      # host (which has neither) doesn't shadow them.
      - /app/node_modules
      - /app/.next
    # `next dev` compiles a route on first hit, so give it a longer warm-up.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # The document editor behind docstudio's dev page (Original tab → Edit
  # document): ONLYOFFICE Docs Community, which opens a Word file or a PDF with
  # its own formatting and edits it in place. Opt-in — it wants ~2 GB of memory:
  #   docker compose --profile editor up -d onlyoffice
  # AGPL-3.0, run unmodified as its own service. Dev only; the secret below is a
  # local default, as the seeded admin password is.
  onlyoffice:
    # Built from the stock image with metric-compatible fonts added; see the
    # Dockerfile for why a contract looks wrong without them.
    build: ./deploy/onlyoffice
    image: aegis-documentserver:local
    profiles: ["editor"]
    ports:
      - "8082:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-aegis-dev-onlyoffice-secret-local-only}"
      # It fetches files from, and saves back to, the backend on this private network.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      # Our own plugin, installed as one of the editor's: it finds the words of
      # a clause in the open document when the page beside it asks. A plugin
      # loaded from elsewhere (pluginsData) is started only now and then since
      # 8.2, so it lives in the editor's own plugin folder, named by its guid.
      - ./backend/app/docstudio/editor_plugin:/var/www/onlyoffice/documentserver/sdkjs-plugins/{6F2A1C54-6E8B-4A1F-9D2C-3B7E5A904F11}:ro
      # and served without caching, so an edit to it reaches the browser
      - ./backend/app/docstudio/editor_nginx.conf:/etc/nginx/includes/ds-aegis-plugin.conf:ro

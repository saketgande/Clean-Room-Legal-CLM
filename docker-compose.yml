# AEGIS Legal CLM — full local stack in Docker.
#
# Everything (Postgres, Redis, API, Celery worker + beat, web) runs in containers.
#
# Quick start:
#   cp backend/.env.example backend/.env   # then edit backend/.env
#   docker compose up -d --build
#   open http://localhost:3000     (API: http://localhost:8000)
#
# All backend app config comes from backend/.env. The networking/storage vars
# below are pinned here (they point at the compose service names + the contracts
# volume) so they're always correct regardless of the env file.
#
#   docker compose up -d                        (this file + docker-compose.override.yml) -> DEVELOPMENT
#   docker compose -f docker-compose.yml up -d  (this file ALONE)                          -> PRODUCTION
#
# ENVIRONMENT is pinned to "production" below so that running this file
# without the dev override ALWAYS gets validate_runtime_settings()'s
# production hardening checks (rejects default secrets, wildcard CORS/hosts,
# mock integrations left on, insecure cookies, etc.) — regardless of whatever
# ENVIRONMENT= backend/.env itself happens to say. docker-compose.override.yml
# overrides this back to "development" for the dev path.

name: aegis

x-backend: &backend
  build:
    context: ./backend
    # Pinned so the dev stage at the end of the Dockerfile is never the
    # implicit default target for a production build.
    target: runtime
  image: aegis/backend:local
  # Single source of truth for app config (keys, secrets, model, integration
  # mocks). Compose reads it from the host, so it works in dev and prod modes.
  env_file:
    - ./backend/.env
  # Container-only overrides: point at the in-stack services + volume, and
  # force production mode by default (see header comment). These take
  # precedence over whatever backend/.env itself says for these keys.
  environment:
    DATABASE_URL: postgresql+psycopg://legal_clm:legal_clm@postgres:5432/legal_clm
    REDIS_URL: redis://redis:6379/0
    STORAGE_ROOT: /data/contracts
    ENVIRONMENT: production
    # This file runs one backend and one worker on one host, sharing the
    # `contracts` volume, so local-disk storage is safe here. Running more than
    # one backend host? Set STORAGE_BACKEND=s3 and remove this line.
    ALLOW_LOCAL_STORAGE_IN_PRODUCTION: "true"
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legal_clm
      POSTGRES_PASSWORD: legal_clm
      POSTGRES_DB: legal_clm
    # Internal-only: the app reaches this at postgres:5432 over the compose
    # network, so the port is NOT published to the host (avoids clashing with a
    # local Postgres or another project's container). To inspect from the host,
    # uncomment and use an unused host port, e.g.:
    #   ports: ["5434:5432"]
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_clm -d legal_clm"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Internal-only (reached at redis:6379 over the compose network); not
    # published to the host. To inspect from the host, uncomment with an unused
    # host port, e.g.:
    #   ports: ["6380:6379"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: apply Alembic migrations, then exit. Everything that needs the
  # schema waits for this to complete successfully.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - contracts:/data/contracts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    # 12 slots: Ask Aegis answers run here (one slot each, mostly waiting on the
    # AI provider) alongside document jobs. Sized for ~10 people asking at once
    # plus spare; idle cost measured at ~140 MiB per slot (2026-10-05).
    command: ["celery", "-A", "app.jobs.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=12"]
    volumes:
      - contracts:/data/contracts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *backend
    command: ["celery", "-A", "app.jobs.celery_app.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    image: aegis/frontend:local
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  contracts:

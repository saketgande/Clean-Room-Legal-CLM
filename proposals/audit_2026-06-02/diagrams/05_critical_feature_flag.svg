<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#fff"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#7f1d1d">Critical #4 — AI feature flags exist but the code never checks them</text>
  <text x="490" y="60" text-anchor="middle" font-size="13" fill="#555">Toggling a feature off in the admin UI literally does nothing. The tool still runs.</text>

  <!-- Admin -->
  <rect x="40" y="120" width="200" height="120" rx="8" fill="#fef9c3" stroke="#a16207"/>
  <text x="140" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#713f12">Admin UI</text>
  <text x="140" y="172" text-anchor="middle" font-size="11">flips switch:</text>
  <text x="140" y="192" text-anchor="middle" font-size="11" font-family="monospace">feature.ai.edit_suggestions</text>
  <text x="140" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">OFF</text>
  <text x="140" y="228" text-anchor="middle" font-size="11" fill="#713f12">saved to AdminSetting table</text>

  <!-- Tool definition -->
  <rect x="290" y="120" width="220" height="120" rx="8" fill="#f4f4f4" stroke="#444"/>
  <text x="400" y="146" text-anchor="middle" font-size="13" font-weight="bold">tool_registry.py</text>
  <text x="400" y="166" text-anchor="middle" font-size="11">declares the tool with:</text>
  <text x="400" y="186" text-anchor="middle" font-family="monospace" font-size="11">name: "propose_edit"</text>
  <text x="400" y="204" text-anchor="middle" font-family="monospace" font-size="11">permission: "ai.edit"</text>
  <text x="400" y="222" text-anchor="middle" font-family="monospace" font-size="11" fill="#dc2626">feature_flag: "feature.ai.edit_suggestions"</text>

  <!-- Runtime check -->
  <rect x="560" y="120" width="380" height="120" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="750" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">tool_runtime.py — execute()</text>
  <text x="750" y="170" text-anchor="middle" font-size="12">when AI calls a tool, this runs:</text>
  <text x="750" y="190" text-anchor="middle" font-family="monospace" font-size="11">✓ checks user has the permission</text>
  <text x="750" y="208" text-anchor="middle" font-family="monospace" font-size="11">✓ checks enabled_by_default</text>
  <text x="750" y="226" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#dc2626">✗ NEVER reads feature_flag from DB</text>

  <!-- Result -->
  <rect x="290" y="280" width="400" height="100" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="490" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">Result: tool runs anyway</text>
  <text x="490" y="328" text-anchor="middle" font-size="12" fill="#7f1d1d">flag is OFF · admin thinks it's disabled</text>
  <text x="490" y="346" text-anchor="middle" font-size="12" fill="#7f1d1d">Claude still calls the tool · tool still executes</text>
  <text x="490" y="366" text-anchor="middle" font-size="12" fill="#7f1d1d">no way to kill-switch a misbehaving AI tool in prod</text>

  <line x1="240" y1="180" x2="290" y2="180" stroke="#444" stroke-width="1.5" marker-end="url(#arr5)"/>
  <line x1="510" y1="180" x2="560" y2="180" stroke="#444" stroke-width="1.5" marker-end="url(#arr5)"/>
  <line x1="490" y1="240" x2="490" y2="280" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr5)"/>

  <!-- Fix -->
  <rect x="60" y="410" width="860" height="120" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="490" y="436" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">The fix (proposed)</text>
  <text x="490" y="458" text-anchor="middle" font-size="12" fill="#065f46">New module `app/ai/tool_policy.py` with `AssistantToolPolicy.is_enabled(tool, db, org_id)`.</text>
  <text x="490" y="478" text-anchor="middle" font-size="12" fill="#065f46">Gate runs in TWO places:</text>
  <text x="490" y="496" text-anchor="middle" font-size="12" fill="#065f46">1. When building the list of tools Claude can call (so disabled tools aren't even offered)</text>
  <text x="490" y="514" text-anchor="middle" font-size="12" fill="#065f46">2. When actually executing — defense in depth. Disabled tool returns a "feature_disabled" message.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="980" height="600" fill="#fff"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#7f1d1d">Critical #3 — Admin queries can leak another company's contracts</text>
  <text x="490" y="60" text-anchor="middle" font-size="13" fill="#555">The "access filter" turns off completely for admins. If any related query forgets to add its own org filter, admins see across companies.</text>

  <!-- Shared DB -->
  <rect x="290" y="110" width="400" height="180" rx="8" fill="#f5f5f5" stroke="#666"/>
  <text x="490" y="136" text-anchor="middle" font-size="14" font-weight="bold">One database, shared by all customers</text>
  <text x="490" y="156" text-anchor="middle" font-size="11" fill="#555">rows are tagged with `org_id` to separate companies</text>

  <!-- Company A contracts -->
  <rect x="310" y="180" width="170" height="40" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="395" y="205" text-anchor="middle" font-size="12">Contract X · org_id = "A"</text>

  <rect x="310" y="230" width="170" height="40" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="395" y="255" text-anchor="middle" font-size="12">Contract Y · org_id = "A"</text>

  <!-- Company B contracts -->
  <rect x="500" y="180" width="170" height="40" rx="4" fill="#fde68a" stroke="#b45309"/>
  <text x="585" y="205" text-anchor="middle" font-size="12">Contract Z · org_id = "B"</text>

  <rect x="500" y="230" width="170" height="40" rx="4" fill="#fde68a" stroke="#b45309"/>
  <text x="585" y="255" text-anchor="middle" font-size="12">Contract W · org_id = "B"</text>

  <!-- Admin -->
  <rect x="40" y="180" width="180" height="100" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="130" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">Admin of Company A</text>
  <text x="130" y="230" text-anchor="middle" font-size="11">opens "obligations" page</text>
  <text x="130" y="248" text-anchor="middle" font-size="11">app calls list_obligations()</text>
  <text x="130" y="268" text-anchor="middle" font-size="11" fill="#7f1d1d">should see ONLY A's stuff</text>

  <!-- Query box -->
  <rect x="40" y="330" width="900" height="120" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="490" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">The buggy query (simplified)</text>
  <text x="60" y="382" font-family="monospace" font-size="12" fill="#78350f">SELECT * FROM obligations</text>
  <text x="60" y="402" font-family="monospace" font-size="12" fill="#78350f">JOIN contracts ON obligations.contract_id = contracts.id</text>
  <text x="60" y="422" font-family="monospace" font-size="12" fill="#78350f">WHERE obligations.org_id = 'A'   ← filters obligations correctly</text>
  <text x="60" y="442" font-family="monospace" font-size="12" fill="#dc2626" font-weight="bold">  AND accessible_contract_filter()   ← for admins this is just "TRUE" → no contract org check</text>

  <!-- Arrows showing leak -->
  <line x1="220" y1="220" x2="500" y2="200" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr4)"/>
  <text x="360" y="190" text-anchor="middle" font-size="11" fill="#dc2626">if one obligation has org_id="A" but its</text>
  <text x="360" y="172" text-anchor="middle" font-size="11" fill="#dc2626">contract_id points to Contract Z (org B)</text>
  <text x="360" y="155" text-anchor="middle" font-size="11" fill="#dc2626">the admin sees Contract Z's details too</text>

  <!-- Why is misalignment possible -->
  <rect x="40" y="465" width="430" height="115" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="255" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">How rows get misaligned</text>
  <text x="255" y="508" text-anchor="middle" font-size="11" fill="#78350f">There's no foreign-key constraint between</text>
  <text x="255" y="524" text-anchor="middle" font-size="11" fill="#78350f">org_id and the organizations table.</text>
  <text x="255" y="544" text-anchor="middle" font-size="11" fill="#78350f">A bug, a manual SQL fix, an import script —</text>
  <text x="255" y="560" text-anchor="middle" font-size="11" fill="#78350f">any of them can write a mismatched org_id.</text>

  <!-- Fix -->
  <rect x="490" y="465" width="450" height="115" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="715" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">The fix (proposed)</text>
  <text x="715" y="508" text-anchor="middle" font-size="11" fill="#065f46">New `ContractAccessPolicy.scope_query()` ALWAYS</text>
  <text x="715" y="524" text-anchor="middle" font-size="11" fill="#065f46">applies the org filter, even for admins.</text>
  <text x="715" y="544" text-anchor="middle" font-size="11" fill="#065f46">Admins escalate WITHIN their org, never across.</text>
  <text x="715" y="560" text-anchor="middle" font-size="11" fill="#065f46">Every JOIN site updated to use it (5 callers).</text>
</svg>

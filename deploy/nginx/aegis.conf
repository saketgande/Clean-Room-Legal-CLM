map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# --- Where the apps run. Define each address ONCE here. ---
upstream aegis_backend {
    # Backend API. The Word add-in's /api/v1 calls end up here too.
    #   - Backend on a SEPARATE VM  ->  use that VM's IP (e.g. 10.1.127.3:8000)
    #   - Backend on THIS machine   ->  use 127.0.0.1:8000
    server 10.1.127.3:8000;
}

upstream aegis_frontend {
    # Next.js frontend, running on this machine (bound to 127.0.0.1:3000).
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name aegis.ctpsandbox.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aegis.ctpsandbox.com;

    ssl_certificate /etc/letsencrypt/live/aegis.ctpsandbox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aegis.ctpsandbox.com/privkey.pem;

    client_max_body_size 60m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Word add-in: plain static files, served straight from disk ---
    # Word loads the panel from https://aegis.ctpsandbox.com/word-addin/taskpane.html.
    # The panel calls /api/v1/... which falls through to the /api/ block below,
    # so the add-in and the API share one origin — no CORS, no extra server.
    location /word-addin/ {
        root /opt/aegis;            # serves files from /opt/aegis/word-addin/
        index taskpane.html;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://aegis_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location /healthz {
        proxy_pass http://aegis_backend;
    }

    location /readyz {
        proxy_pass http://aegis_backend;
    }

    location / {
        proxy_pass http://aegis_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

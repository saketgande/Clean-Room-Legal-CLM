# Tooling config only: the tool server is run from source (PYTHONPATH=/app), not built
# or installed as a package.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "DTZ", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and hard-coded fake keys by design.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# No cache dir: the runtime image runs with a read-only root filesystem.
addopts = "-p no:cacheprovider"

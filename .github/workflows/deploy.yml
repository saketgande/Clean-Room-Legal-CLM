name: Deploy

# Builds and publishes the production backend image to GitHub Container Registry
# (ghcr.io) on every push to main, tagged with the commit SHA (plus a moving
# :latest). The actual server rollout is a documented manual/placeholder step —
# wire it to your host's deploy mechanism (see DEPLOY.md "rollout").

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        run: |
          repo_lc=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=${repo_lc}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${repo_lc}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${repo_lc}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Rollout (PLACEHOLDER) -------------------------------------------
      # Pull the freshly-built, SHA-pinned image on the server and restart the
      # stack. Implement with your access method of choice (SSH, a runner on the
      # host, or a config-management tool). Example over SSH:
      #
      #   - name: Deploy over SSH
      #     uses: appleboy/ssh-action@v1
      #     with:
      #       host: ${{ secrets.DEPLOY_HOST }}
      #       username: ${{ secrets.DEPLOY_USER }}
      #       key: ${{ secrets.DEPLOY_SSH_KEY }}
      #       script: |
      #         cd /opt/aegis/backend
      #         echo "AEGIS_IMAGE=${{ steps.meta.outputs.sha_tag }}" > .image-tag
      #         docker compose -f docker-compose.prod.yml pull api worker beat
      #         docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
      #         docker compose -f docker-compose.prod.yml up -d
      #
      # (To consume the registry image instead of building on the host, override
      #  the api/worker/beat `image:` in a compose override to the SHA tag.)
      - name: Rollout reminder
        run: |
          echo "Pushed ${{ steps.meta.outputs.sha_tag }}"
          echo "Server rollout is a documented placeholder — see DEPLOY.md."
